name: Feature request
description: Suggest an improvement or new feature
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should be built or changed?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Designs, screenshots, links, or extra context.